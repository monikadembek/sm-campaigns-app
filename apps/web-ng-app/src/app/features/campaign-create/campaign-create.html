<div class="container">
  <h1 class="text-2xl font-semibold text-center mb-10">Create new campaign</h1>
  <app-campaign-create-form
    [goals]="campaignGoals.value()"
    (cancelEdit)="cancel()"
    (saveForm)="saveNewCampaign($event)"
  ></app-campaign-create-form>

  @if (campaignGoals.error()) {
  <p-message severity="error" size="small">
    Error occured, issue with getting campaign goals list. Please try again
    later.
  </p-message>
  }
</div>
<p-confirm-dialog />
